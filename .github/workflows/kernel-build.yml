name: Kernel build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld nasm
      - name: Build kernel
        run: make -j2 build/kernel.bin
